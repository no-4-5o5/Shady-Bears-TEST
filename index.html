<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    #game {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      border: none;
    }
  </style>
</head>

<body>

<script>
/* ONLY fix revive (this is your freeze point) */
window.revive = function(callback) {
  // instantly succeed so game never freezes
  if (typeof callback === "function") {
    setTimeout(() => callback(true), 0);
  }
  return true;
};
</script>

<embed id="game" src="medvedi.swf">

</body>
</html>
