<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    #game {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      border: none;
    }

    /* optional: prevents focus outlines */
    embed:focus {
      outline: none;
    }
  </style>
</head>

<body>

<!-- Safe ad SDK stubs (prevents freezes when game expects ads) -->
<script>
window.GoogleIMA = window.GoogleIMA || {};

window.PokiSDK = {
  init: () => Promise.resolve(true),
  commercialBreak: (cb) => { if (cb) cb(true); return Promise.resolve(true); },
  rewardedBreak: (cb) => { if (cb) cb(true); return Promise.resolve(true); },
  gameplayStart: () => {},
  gameplayStop: () => {}
};

window.adBreak = (cfg) => {
  if (cfg?.beforeAd) cfg.beforeAd();
  if (cfg?.afterAd) cfg.afterAd();
  if (cfg?.adBreakDone) cfg.adBreakDone();
};

window.showAd = () => Promise.resolve(true);
window.showAds = () => {};
window.requestAds = () => Promise.resolve(true);
window.rewardedAd = () => Promise.resolve(true);
window.revive = () => true;
</script>

<!-- SWF -->
<embed id="game" src="medvedi.swf">

</body>
</html>
