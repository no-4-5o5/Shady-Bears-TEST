<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fullscreen Game</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

#game-frame {
    width: 100vw;
    height: 100vh;
    border: none;
    display: block;
}
</style>
</head>

<body>

<!-- Replace game.html with your game file -->
<iframe id="game-frame" src="shady-bears.html" allowfullscreen></iframe>

</body>
</html>
